<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clothing Management</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/layout.css"/>
  <link rel="stylesheet" href="css/pages.css"/>
</head>
<body>

<!-- ══════════════════ AUTH SCREEN ══════════════════ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="ti ti-shirt" aria-hidden="true"></i></div>
      <span>Clothing Management</span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Đăng nhập</button>
      <button class="auth-tab" onclick="switchTab('register')">Đăng ký</button>
    </div>

    <div id="alert-auth" class="alert danger"></div>

    <!-- Login form -->
    <div id="form-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn-primary" id="btn-login" onclick="doLogin()">Đăng nhập</button>
    </div>

    <!-- Register form -->
    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="reg-username" placeholder="nguyenvana"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="reg-password" placeholder="Tối thiểu 6 ký tự"/>
      </div>
      <button class="btn-primary" id="btn-register" onclick="doRegister()">Tạo tài khoản</button>
    </div>
  </div>
</div>

<!-- ══════════════════ APP SCREEN ══════════════════ -->
<div id="app-screen">
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon"><i class="ti ti-shirt" aria-hidden="true"></i></div>
        <span>Clothing</span>
      </div>
      <nav class="nav">
        <div class="nav-section">Tổng quan</div>
        <button class="nav-item active" onclick="showPage('dashboard')">
          <i class="ti ti-layout-dashboard" aria-hidden="true"></i> Dashboard
        </button>

        <div class="nav-section">Quản lý</div>
        <button class="nav-item" onclick="showPage('users')" id="nav-users" style="display:none">
          <i class="ti ti-users" aria-hidden="true"></i> Người dùng
        </button>
        <button class="nav-item" onclick="showPage('profile')">
          <i class="ti ti-user-circle" aria-hidden="true"></i> Hồ sơ cá nhân
        </button>

        <div class="nav-section">Hệ thống</div>
        <button class="nav-item" onclick="showComingSoon('Sản phẩm')">
          <i class="ti ti-hanger" aria-hidden="true"></i> Sản phẩm
        </button>
        <button class="nav-item" onclick="showComingSoon('Đơn hàng')">
          <i class="ti ti-shopping-cart" aria-hidden="true"></i> Đơn hàng
        </button>
        <button class="nav-item" onclick="showComingSoon('Kho hàng')">
          <i class="ti ti-building-warehouse" aria-hidden="true"></i> Kho hàng
        </button>
        <button class="nav-item" onclick="showComingSoon('Báo cáo')">
          <i class="ti ti-chart-bar" aria-hidden="true"></i> Báo cáo
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="sidebar-avatar">?</div>
          <div class="user-chip-info">
            <div class="user-chip-name" id="sidebar-name">—</div>
            <div class="user-chip-role" id="sidebar-role">—</div>
          </div>
          <button class="btn-icon" onclick="doLogout()" title="Đăng xuất">
            <i class="ti ti-logout" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <span class="topbar-title" id="topbar-title">Dashboard</span>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <div class="content" id="page-content">
        <!-- Rendered by JS -->
      </div>
    </div>

  </div>
</div>

<!-- ══════════════════ MODAL: Add User ══════════════════ -->
<div class="modal-backdrop" id="modal-add-user">
  <div class="modal">
    <div class="modal-header">
      <h3>Thêm người dùng</h3>
      <button class="btn-icon" onclick="closeModal('modal-add-user')">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
    </div>
    <div class="modal-body">
      <div id="modal-alert" class="alert danger"></div>
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="modal-username" placeholder="nguyenvana"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="modal-email" placeholder="email@example.com"/>
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="modal-password" placeholder="Tối thiểu 6 ký tự"/>
      </div>
      <div class="form-group">
        <label>Vai trò</label>
        <select id="modal-role">
          <option value="User">Người dùng</option>
          <option value="Staff">Nhân viên</option>
          <option value="Admin">Admin</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-add-user')">Hủy</button>
      <button class="btn btn-green" id="btn-add-user" onclick="submitAddUser()">
        <i class="ti ti-plus" aria-hidden="true"></i> Tạo tài khoản
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════ MODAL: Edit User ══════════════════ -->
<div class="modal-backdrop" id="modal-edit-user">
  <div class="modal">
    <div class="modal-header">
      <h3>Sửa người dùng</h3>
      <button class="btn-icon" onclick="closeModal('modal-edit-user')">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
    </div>
    <div class="modal-body">
      <div id="edit-modal-alert" class="alert danger"></div>
      <input type="hidden" id="edit-auth-user-id"/>
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="edit-username"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="edit-email"/>
      </div>
      <div class="form-group">
        <label>Vai trò</label>
        <select id="edit-role">
          <option value="User">Người dùng</option>
          <option value="Staff">Nhân viên</option>
        </select>
      </div>
      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" id="edit-fullname"/>
      </div>
      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="text" id="edit-phone" placeholder="0901234567"/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-edit-user')">Hủy</button>
      <button class="btn btn-green" id="btn-save-edit-user" onclick="submitEditUser()">
        <i class="ti ti-device-floppy" aria-hidden="true"></i> Lưu thay đổi
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════ MODAL: Change Password ══════════════════ -->
<div class="modal-backdrop" id="modal-change-pw">
  <div class="modal">
    <div class="modal-header">
      <h3>Đổi mật khẩu</h3>
      <button class="btn-icon" onclick="closeModal('modal-change-pw')">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
    </div>
    <div class="modal-body">
      <div id="modal-pw-alert" class="alert danger"></div>
      <div class="form-group">
        <label>Mật khẩu hiện tại</label>
        <input type="password" id="old-password" placeholder="••••••••"/>
      </div>
      <div class="form-group">
        <label>Mật khẩu mới</label>
        <input type="password" id="new-password" placeholder="Tối thiểu 6 ký tự"/>
      </div>
      <div class="form-group">
        <label>Xác nhận mật khẩu mới</label>
        <input type="password" id="confirm-password" placeholder="••••••••"/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-change-pw')">Hủy</button>
      <button class="btn btn-green" id="btn-change-pw" onclick="submitChangePw()">
        <i class="ti ti-lock" aria-hidden="true"></i> Đổi mật khẩu
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Scripts — thứ tự quan trọng -->
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/users.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>

</body>
</html>
